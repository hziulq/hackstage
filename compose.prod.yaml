# VPS向け本番構成。Renderにはこのファイルを使わない(render.yamlが正)。
# 使い方は docs/vps-deploy.md 参照。
#
# 起動前に  cp .env.example .env  して値を埋めること（本番用の値。docs/vps-deploy.md 参照）。

name: hackstage

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
      target: prod
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # apps/api/app/extensions.py の MIGRATIONS_DIR はコンテナ内で /migrations に
      # 解決される。api イメージのビルドコンテキストは ./apps/api だけなので、
      # リポジトリルートの migrations/ を明示的にマウントしないと flask db upgrade が失敗する
      - ./migrations:/migrations:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: prod
    env_file:
      - path: .env
        required: false
    environment:
      # standaloneサーバーがcaddyコンテナから到達できるようにする保険
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
